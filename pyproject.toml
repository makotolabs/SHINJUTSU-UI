[project]
name = "shinjutsu-ui"
description = "SHINJUTSU UI (神術) — Open-Weights Creative Studio, 33.34 MB 10-Block SVD Control-LoRA & BiRefNet_lite Auto-Cutout for ComfyUI"
version = "1.0.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "safetensors>=0.4.0",
    "scipy>=1.10.0",
]

[project.urls]
Homepage = "https://shinjutsu.ai"
Repository = "https://github.com/makotolabs/SHINJUTSU-UI"
Documentation = "https://github.com/makotolabs/SHINJUTSU-UI#readme"

[tool.comfy]
PublisherId = "makotolabs"
DisplayName = "SHINJUTSU UI (Open-Weights Studio & Motion Transfer)"
Icon = "assets/shinjutsu_icon.png"

[project.optional-dependencies]
sdk = ["comfy-sdk>=0.5.0", "comfy-api-proxy>=0.1.6"]
test = ["pytest>=7", "aiohttp>=3.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
